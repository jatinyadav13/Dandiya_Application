<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Committee desk – Dandiya Night</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{--night:#17113f;--gold:#ffb400;--pink:#e6007e;--paper:#fff9f0;--ink:#1d1740;--mut:#6b6590;--line:#e6dccb}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
header{background:var(--night);color:var(--gold);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font:400 24px "Rozha One",serif}
main{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--paper);border-radius:12px;padding:12px;text-align:center;color:var(--mut);font-size:13px}
.stat b{display:block;font:400 26px "Rozha One",serif;color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 0}.bar i{display:block;height:100%;background:var(--pink)}
input,select{width:100%;padding:11px;font:inherit;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.sm{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;margin-right:4px;color:var(--ink)}
.sm.go{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.sm.warn{color:#b00020}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}th{color:var(--mut);font-weight:500}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;display:inline-block}.ok{background:#dff5e3;color:#14692b}.wait{background:#fff0c2;color:#7a5600}.bad{background:#fde1e4;color:#b00020}
.mut{color:var(--mut);font-size:14px}.hide{display:none}
.sub{color:var(--mut);font-size:13px}
#sync{color:#a8a2d0;font-size:12px;margin-right:6px}
@media print{header,#q,#f,.sm,#stats,.bar,#tgt,.toolbar{display:none!important}th:last-child,td:last-child{display:none}}
#login{max-width:360px;margin:60px auto}

/* ---- mobile friendly ---- */
input,select{font-size:16px}
.sm{min-height:38px}
@media screen and (max-width:700px){
 header{padding:12px 14px}header h1{font-size:20px}
 main{padding:12px 10px 32px}
 .card{padding:12px}
 .wrap{overflow:visible}
 thead{display:none}
 table,tbody,tr,td{display:block;width:100%}
 tr{border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}
 td{border:0;white-space:normal;padding:3px 6px}
 td:nth-child(1)::before{content:"Pass: ";color:var(--mut)}
 td:nth-child(3)::before{content:"Mobile: ";color:var(--mut)}
 td:nth-child(4)::before{content:"Ticket: ";color:var(--mut)}
 td:nth-child(5)::before{content:"Amount: ₹";color:var(--mut)}
 td:last-child{padding-top:8px}
 .sm{padding:9px 14px;margin:4px 6px 0 0}
 #login{margin:30px auto}
}
</style>
</head>
<body>
<header><h1>Committee desk</h1><span id="who" class="hide"><span id="sync"></span><button class="sm" id="prt">Print list</button><button class="sm" id="csv">Download Excel file</button><button class="sm" id="out">Log out</button></span></header>
<main>
  <div id="login" class="card">
    <h2 style="margin-top:0">Committee login</h2>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <p class="mut" id="lerr" role="alert" style="color:#b00020"></p>
    <button class="btn" id="lgo" style="width:100%">Log in</button>
  </div>
  <div id="app" class="hide">
    <div class="card"><div class="stats" id="stats"></div><p class="mut" id="tgt" style="margin:12px 0 0"></p><div class="bar"><i id="bar"></i></div></div>
    <div class="card">
      <div class="toolbar" style="display:flex;gap:8px;flex-wrap:wrap"><input id="q" style="flex:1;min-width:200px" placeholder="Search by name, mobile, pass number or UTR (use this at the gate)" autocomplete="off"><select id="f" style="width:auto"><option value="">All</option><option value="pending">Pending</option><option value="verify">Paid by UPI, to verify</option><option value="paid">Paid</option><option value="notin">Paid, not yet entered</option><option value="in">Checked in</option></select></div>
      <div class="wrap"><table><thead><tr><th>Pass</th><th>Name</th><th>Mobile</th><th>Ticket</th><th>₹</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);let key=sessionStorage.getItem('k')||'',all=[],busy=false;
const TARGET=150;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guests=r=>Number(r.guests)||1;
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const ticket=r=>r.type==='insider'?'Student'+(r.year?' · '+r.year+(['','st','nd','rd','th'][r.year]||'th')+' yr':''):(r.ticket==='couple'?'Guest · couple (2)':'Guest · single');
const mismatch=r=>r.paidAmount!=null&&Number(r.paidAmount)!==Number(r.amount);
async function call(url,method='GET'){
  const r=await fetch(url,{method,headers:{'x-admin-key':key}});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||(r.status===401?'Wrong password.':'Something went wrong. Try again.'));}
  return r;
}
async function load(){
  const r=await call('/api/admin/regs');all=await r.json();
  $('login').classList.add('hide');$('app').classList.remove('hide');$('who').classList.remove('hide');
  $('sync').textContent='Updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});draw();
}
function draw(){
  const paid=all.filter(r=>r.status==='paid'),pend=all.filter(r=>r.status!=='paid'),verify=pend.filter(r=>r.utr);
  const people=all.reduce((s,r)=>s+guests(r),0),paidPeople=paid.reduce((s,r)=>s+guests(r),0),inside=paid.filter(r=>r.checkedIn).reduce((s,r)=>s+guests(r),0);
  const stu=all.filter(r=>r.type==='insider').length,gst=all.filter(r=>r.type!=='insider').reduce((s,r)=>s+guests(r),0);
  const pct=Math.min(100,Math.round(people/TARGET*100));
  $('stats').innerHTML=[[all.length,'Passes'],[people,'People'],[paid.length,'Paid'],[pend.length,'Pending'],[verify.length,'UTR to verify'],
    [stu+' / '+gst,'Students / guests'],[inr(paid.reduce((s,r)=>s+Number(r.amount||0),0)),'Collected'],[inside+' / '+paidPeople,'Inside / expected']]
    .map(s=>`<div class="stat"><b>${s[0]}</b>${s[1]}</div>`).join('');
  $('tgt').textContent=`Go-ahead target: ${TARGET} people (${people}/${TARGET})`+(people>=TARGET?' – reached':'');$('bar').style.width=pct+'%';
  const q=$('q').value.toLowerCase().trim(),f=$('f').value;
  const match=r=>{
    if(q&&!(r.name+' '+r.phone+' '+r.passNo+' '+(r.utr||'')+' '+(r.partner||'')).toLowerCase().includes(q))return false;
    switch(f){case'pending':return r.status!=='paid';case'verify':return r.status!=='paid'&&!!r.utr;case'paid':return r.status==='paid';
      case'notin':return r.status==='paid'&&!r.checkedIn;case'in':return !!r.checkedIn;default:return true;}
  };
  $('rows').innerHTML=all.filter(match).map(r=>{
    const isPaid=r.status==='paid';
    return `<tr><td>${esc(r.passNo)}</td>
   <td>${esc(r.name)}<div class="mut">${esc(r.detail)}</div>${r.utr?`<div class="mut">UTR: ${esc(r.utr)}${r.paidAmount!=null?' · paid '+inr(r.paidAmount):''}</div>`:''}${!isPaid&&mismatch(r)?`<div><span class="tag bad">Paid ${inr(r.paidAmount)}, pass is ${inr(r.amount)}</span></div>`:''}</td>
   <td>${esc(r.phone)}</td><td>${esc(ticket(r))}</td><td>${esc(r.amount)}</td>
   <td><span class="tag ${isPaid?'ok':'wait'}">${isPaid?'paid':(r.utr?'to verify':'pending')}</span>${r.checkedIn?' · in':''}</td>
   <td>${!isPaid?`<button class="sm go" data-a="pay" data-id="${r.id}">Confirm payment</button>`
     :`<button class="sm go" data-a="checkin" data-id="${r.id}">${r.checkedIn?'Undo entry':'Check in'+(guests(r)>1?' (2)':'')}</button>${r.checkedIn?'':`<button class="sm" data-a="unpay" data-id="${r.id}">Undo payment</button>`}`}
   <button class="sm warn" data-a="del" data-id="${r.id}">Delete</button></td></tr>`;}).join('')||'<tr><td colspan="7" class="mut">No registrations match.</td></tr>';
}
$('rows').onclick=async e=>{
  const b=e.target.closest('button');if(!b||busy)return;const id=b.dataset.id,a=b.dataset.a,r=all.find(x=>String(x.id)===id);
  if(a==='del'&&!confirm('Delete the registration of '+(r?r.name:'this person')+'? This cannot be undone.'))return;
  if(a==='unpay'&&!confirm('Mark '+(r?r.name:'this pass')+' as unpaid again?'))return;
  if(a==='pay'&&r&&mismatch(r)&&!confirm(r.name+' says they paid '+inr(r.paidAmount)+' but the pass costs '+inr(r.amount)+'. Confirm payment anyway?'))return;
  busy=true;b.disabled=true;
  try{await call('/api/admin/'+id+(a==='del'?'':'/'+a),a==='del'?'DELETE':'POST');await load();}
  catch(x){alert(x.message);}
  busy=false;b.disabled=false;
};
$('q').oninput=draw;$('f').onchange=draw;$('prt').onclick=()=>window.print();
$('lgo').onclick=async()=>{key=$('pw').value;$('lerr').textContent='';try{await load();sessionStorage.setItem('k',key);}catch(e){$('lerr').textContent=e.message;}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lgo').click();};
$('out').onclick=()=>{sessionStorage.removeItem('k');location.reload();};
$('csv').onclick=async()=>{try{const t=await (await call('/api/admin/export')).text();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='dandiya-registrations.csv';a.click();}catch(e){alert(e.message);}};
if(key)load().catch(()=>sessionStorage.removeItem('k'));
setInterval(()=>{if(key&&!busy&&!$('app').classList.contains('hide'))load().catch(()=>{$('sync').textContent='Offline, retrying…';});},20000);
</script>
</body>
</html>
