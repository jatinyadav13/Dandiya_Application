<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Committee desk – Dandiya Night</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{--night:#17113f;--gold:#ffb400;--pink:#e6007e;--paper:#fff9f0;--ink:#1d1740;--mut:#6b6590;--line:#e6dccb}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
header{background:var(--night);color:var(--gold);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font:400 24px "Rozha One",serif}
main{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--paper);border-radius:12px;padding:12px;text-align:center;color:var(--mut);font-size:13px}
.stat b{display:block;font:400 26px "Rozha One",serif;color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 0}.bar i{display:block;height:100%;background:var(--pink)}
input{width:100%;padding:11px;font:inherit;border:1.5px solid var(--line);border-radius:10px}
button{font:inherit;cursor:pointer}
.btn{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.sm{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;margin-right:4px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:500}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:#dff5e3;color:#14692b}.wait{background:#fff0c2;color:#7a5600}
.mut{color:var(--mut);font-size:14px}.hide{display:none}
@media print{header,#q,#f,.sm,#stats,.bar,#tgt{display:none!important}th:last-child,td:last-child{display:none}}
#login{max-width:360px;margin:60px auto}
</style>
</head>
<body>
<header><h1>Committee desk</h1><span id="who" class="hide"><button class="sm" id="prt">Print list</button><button class="sm" id="csv">Download Excel file</button><button class="sm" id="out">Log out</button></span></header>
<main>
  <div id="login" class="card">
    <h2 style="margin-top:0">Committee login</h2>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <p class="mut" id="lerr" role="alert" style="color:#b00020"></p>
    <button class="btn" id="lgo" style="width:100%">Log in</button>
  </div>
  <div id="app" class="hide">
    <div class="card"><div class="stats" id="stats"></div><p class="mut" id="tgt" style="margin:12px 0 0"></p><div class="bar"><i id="bar"></i></div></div>
    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="q" style="flex:1;min-width:200px" placeholder="Search by name, mobile or pass number (use this at the gate)"><select id="f" style="padding:10px;border-radius:10px;border:1.5px solid var(--line);font:inherit"><option value="">All</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="in">Checked in</option></select></div>
      <div class="wrap"><table><thead><tr><th>Pass</th><th>Name</th><th>Mobile</th><th>Type</th><th>₹</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);let key=sessionStorage.getItem('k')||'',all=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(url,method='GET'){const r=await fetch(url,{method,headers:{'x-admin-key':key}});if(r.status===401)throw new Error('Wrong password.');return r;}
async function load(){
  const r=await call('/api/admin/regs');all=await r.json();
  $('login').classList.add('hide');$('app').classList.remove('hide');$('who').classList.remove('hide');draw();
}
function draw(){
  const paid=all.filter(r=>r.status==='paid'),ins=paid.filter(r=>r.type==='insider').length,out=paid.length-ins,pct=Math.min(100,Math.round(all.length/150*100));
  $('stats').innerHTML=[[all.length,'Registered'],[paid.length,'Paid'],[all.length-paid.length,'Pending'],[ins+' / '+out,'Student / guest'],
    ['₹'+(ins*300+out*400).toLocaleString('en-IN'),'Collected'],[paid.filter(r=>r.checkedIn).length,'Checked in']].map(s=>`<div class="stat"><b>${s[0]}</b>${s[1]}</div>`).join('');
  $('tgt').textContent=`Go-ahead target: 150 students (${all.length}/150)`+(all.length>=150?' – reached':'');$('bar').style.width=pct+'%';
  const q=$('q').value.toLowerCase(),f=$('f').value;
  $('rows').innerHTML=all.filter(r=>(!q||(r.name+r.phone+r.passNo).toLowerCase().includes(q))&&(!$('f').value||(f==='in'?r.checkedIn:r.status===f))).map(r=>`<tr><td>${esc(r.passNo)}</td>
   <td>${esc(r.name)}<div class="mut">${esc(r.detail)}</div>${r.utr?`<div class="mut">UTR: ${esc(r.utr)}</div>`:''}</td><td>${esc(r.phone)}</td><td>${r.type}</td><td>${r.amount}</td>
   <td><span class="tag ${r.status==='paid'?'ok':'wait'}">${r.status}</span>${r.checkedIn?' · in':''}</td>
   <td>${r.status!=='paid'?`<button class="sm" data-a="pay" data-id="${r.id}">Confirm payment</button>`:`<button class="sm" data-a="checkin" data-id="${r.id}">${r.checkedIn?'Undo entry':'Check in'}</button>`}
   <button class="sm" data-a="del" data-id="${r.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="mut">No registrations match.</td></tr>';
}
$('rows').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,a=b.dataset.a;
  try{if(a==='del'){if(!confirm('Delete this registration?'))return;await call('/api/admin/'+id,'DELETE');}else await call('/api/admin/'+id+'/'+a,'POST');await load();}catch(x){alert(x.message);}};
$('q').oninput=draw;$('f').onchange=draw;$('prt').onclick=()=>window.print();
$('lgo').onclick=async()=>{key=$('pw').value;try{await load();sessionStorage.setItem('k',key);}catch(e){$('lerr').textContent=e.message;}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lgo').click();};
$('out').onclick=()=>{sessionStorage.removeItem('k');location.reload();};
$('csv').onclick=async()=>{const t=await (await call('/api/admin/export')).text();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='dandiya-registrations.csv';a.click();};
if(key)load().catch(()=>sessionStorage.removeItem('k'));
setInterval(()=>{if(key&&!$('app').classList.contains('hide'))load().catch(()=>{});},20000);
</script>
</body>
</html>
